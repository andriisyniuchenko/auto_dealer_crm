{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="form-page">
    <h2>Sign In</h2>

    <form method="post" action="/api/v1/login-page" style="margin:0;padding:0;background:none;box-shadow:none;border-radius:0;">
        <div class="form-field">
            <label>Email</label>
            <input type="email" name="username" required placeholder="you@example.com">
        </div>
        <div class="form-field">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>

        {% if error %}
        <div class="alert-error">⚠ {{ error }}</div>
        {% endif %}

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">Sign In</button>
    </form>
</div>
{% endblock %}
