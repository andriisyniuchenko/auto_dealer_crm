name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_dealer_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/auto_dealer_crm_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/auto_dealer_crm_test
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_ADMIN_FIRST_NAME: ${{ secrets.FIRST_ADMIN_FIRST_NAME }}
      FIRST_ADMIN_LAST_NAME: ${{ secrets.FIRST_ADMIN_LAST_NAME }}
      FIRST_ADMIN_EMAIL: ${{ secrets.FIRST_ADMIN_EMAIL }}
      FIRST_ADMIN_PASSWORD: ${{ secrets.FIRST_ADMIN_PASSWORD }}
      WEBSITE_API_KEY: ${{ secrets.WEBSITE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short