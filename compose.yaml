services:
  db:
    image: postgres:16
    container_name: auto_dealer_crm_db
    environment:
      POSTGRES_DB: auto_dealer_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_dealer_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: auto_dealer_crm_web
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - WEBSITE_API_KEY=${WEBSITE_API_KEY}
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/auto_dealer_crm
      - TEST_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/auto_dealer_crm_test
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: